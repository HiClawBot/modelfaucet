name: container-images

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/gateway/**"
      - "apps/dashboard/**"
      - "packages/shared/**"
      - "infra/docker/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/container-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            package: "@modelfaucet/api"
            image: ghcr.io/hiclawbot/modelfaucet-api
          - service: gateway
            package: "@modelfaucet/gateway"
            image: ghcr.io/hiclawbot/modelfaucet-gateway
          - service: dashboard
            package: "@modelfaucet/dashboard"
            image: ghcr.io/hiclawbot/modelfaucet-dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=ModelFaucet ${{ matrix.service }}
            org.opencontainers.image.description=ModelFaucet ${{ matrix.service }} service image
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/node-service.Dockerfile
          build-args: |
            SERVICE_PACKAGE=${{ matrix.package }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
