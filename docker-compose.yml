services:
  postgres:
    image: postgres:16.13-bookworm
    container_name: modelfaucet-postgres
    command: ["postgres", "-p", "3200"]
    environment:
      POSTGRES_USER: modelfaucet
      POSTGRES_PASSWORD: modelfaucet
      POSTGRES_DB: modelfaucet
    ports:
      - "3200:3200"
    volumes:
      - modelfaucet_pg:/var/lib/postgresql/data
      - ./infra/db/schema.sql:/docker-entrypoint-initdb.d/0001_schema.sql:ro
      - ./infra/db/seed.sql:/docker-entrypoint-initdb.d/0002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelfaucet -d modelfaucet -p 3200"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.9-bookworm
    container_name: modelfaucet-redis
    command: ["redis-server", "--port", "3290"]
    ports:
      - "3290:3290"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "3290", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:v1.93.0
    container_name: modelfaucet-litellm
    ports:
      - "3205:3205"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-dev-master-key}
      MOCK_PROVIDER_API_KEY: ${MOCK_PROVIDER_API_KEY:-sk-test-local-mock-provider-key}
      MOCK_OPENAI_BASE_URL: http://mock-provider:3210/v1
      DATABASE_URL: postgresql://modelfaucet:modelfaucet@postgres:3200/modelfaucet
    volumes:
      - ./infra/docker/litellm.smoke.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "3205", "--host", "0.0.0.0"]
    depends_on:
      postgres:
        condition: service_healthy
      mock-provider:
        condition: service_healthy

  mock-provider:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      target: development
    container_name: modelfaucet-mock-provider
    command: ["node", "scripts/mock-openai-compatible.mjs"]
    environment:
      PORT: 3210
      HOST: 0.0.0.0
    ports:
      - "3210:3210"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3210/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      target: development
    container_name: modelfaucet-api
    command: ["pnpm", "--filter", "@modelfaucet/api", "dev"]
    environment:
      NODE_ENV: development
      PORT_API: 3201
      DATABASE_URL: postgresql://modelfaucet:modelfaucet@postgres:3200/modelfaucet
      REDIS_URL: redis://redis:3290
      GATEWAY_BASE_URL: http://gateway:3202/v1
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-dev_32_bytes_replace_me_replace_me}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-mf_admin_dev}
      DEVELOPER_ADMIN_TOKEN: ${DEVELOPER_ADMIN_TOKEN:-mf_admin_dev}
      SESSION_TOKEN_TTL_SECONDS: ${SESSION_TOKEN_TTL_SECONDS:-3600}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYOUT_THRESHOLD_USD: ${PAYOUT_THRESHOLD_USD:-1.00000000}
    ports:
      - "3201:3201"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3201/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      target: development
    container_name: modelfaucet-gateway
    command: ["pnpm", "--filter", "@modelfaucet/gateway", "dev"]
    environment:
      NODE_ENV: development
      PORT_GATEWAY: 3202
      DATABASE_URL: postgresql://modelfaucet:modelfaucet@postgres:3200/modelfaucet
      REDIS_URL: redis://redis:3290
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:3205}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-test-litellm-master-key}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-dev_32_bytes_replace_me_replace_me}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-30000}
      PROVIDER_MAX_RETRIES: ${PROVIDER_MAX_RETRIES:-1}
      PROVIDER_RETRY_DELAY_MS: ${PROVIDER_RETRY_DELAY_MS:-250}
      GATEWAY_PLATFORM_MODEL: ${GATEWAY_PLATFORM_MODEL:-auto-text}
      GATEWAY_PLATFORM_INPUT_PRICE_PER_1M_TOKENS_USD: ${GATEWAY_PLATFORM_INPUT_PRICE_PER_1M_TOKENS_USD:-1.00000000}
      GATEWAY_PLATFORM_OUTPUT_PRICE_PER_1M_TOKENS_USD: ${GATEWAY_PLATFORM_OUTPUT_PRICE_PER_1M_TOKENS_USD:-2.00000000}
      GATEWAY_PLATFORM_MARKUP_PERCENT: ${GATEWAY_PLATFORM_MARKUP_PERCENT:-30}
      GATEWAY_PLATFORM_MAX_INPUT_TOKENS: ${GATEWAY_PLATFORM_MAX_INPUT_TOKENS:-8192}
      GATEWAY_PLATFORM_MAX_OUTPUT_TOKENS: ${GATEWAY_PLATFORM_MAX_OUTPUT_TOKENS:-1024}
      GATEWAY_RESERVATION_TTL_MS: ${GATEWAY_RESERVATION_TTL_MS:-120000}
    ports:
      - "3202:3202"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-provider:
        condition: service_healthy
      litellm:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3202/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      target: development
    container_name: modelfaucet-dashboard
    command:
      [
        "pnpm",
        "--filter",
        "@modelfaucet/dashboard",
        "exec",
        "vite",
        "--host",
        "0.0.0.0",
        "--port",
        "3203"
      ]
    environment:
      VITE_MODELFAUCET_API_BASE_URL: http://localhost:3201
      VITE_MODELFAUCET_DEVELOPER_ADMIN_TOKEN: ${DEVELOPER_ADMIN_TOKEN:-mf_admin_dev}
    ports:
      - "3203:3203"
    depends_on:
      api:
        condition: service_healthy

  crm-demo:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      target: development
    container_name: modelfaucet-crm-demo
    command:
      [
        "pnpm",
        "--filter",
        "crm-demo",
        "exec",
        "vite",
        "--host",
        "0.0.0.0",
        "--port",
        "3204"
      ]
    environment:
      VITE_MODELFAUCET_API_BASE_URL: http://localhost:3201
      VITE_MODELFAUCET_GATEWAY_BASE_URL: http://localhost:3202/v1
    ports:
      - "3204:3204"
    depends_on:
      api:
        condition: service_healthy
      gateway:
        condition: service_healthy

volumes:
  modelfaucet_pg:
